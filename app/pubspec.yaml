name: mybib
description: mybib – catalogue books, board games, DVDs and CDs.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0
  # Exakte Flutter-Version für alle CI-Builds (flutter-version-file in .github/workflows).
  flutter: 3.47.6

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  mobile_scanner: ^7.4.2
  share_plus: ^13.3.1
  file_picker: ^13.1.0
  cached_network_image: ^4.0.4
  wakelock_plus: ^1.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
