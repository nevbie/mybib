name: App release build (Android)

# Builds the signed release APK + AAB from app/ and publishes a GitHub Release.
# Runs on every change to app/ on main (i.e. after a pull request is merged).
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/app-build.yml'
  workflow_dispatch:

concurrency:
  group: app-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # volle History für die Build-Nummer (ci/prepare.sh)

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: app/pubspec.yaml
          cache: true

      - name: Prepare Android project
        working-directory: app
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: bash ci/prepare.sh

      - name: Get packages
        working-directory: app
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        working-directory: app
        run: flutter test

      - name: Build APK
        working-directory: app
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: flutter build apk --release --build-name ${{ env.APP_VERSION }} --build-number ${{ env.BUILD_NUMBER }} --dart-define=APP_VERSION=${{ env.APP_VERSION }}

      - name: Build app bundle for Play Store
        working-directory: app
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: flutter build appbundle --release --build-name ${{ env.APP_VERSION }} --build-number ${{ env.BUILD_NUMBER }} --dart-define=APP_VERSION=${{ env.APP_VERSION }}

      - name: Rename outputs
        run: |
          cp "app/build/app/outputs/flutter-apk/app-release.apk" "${{ env.APP_NAME }}-${{ env.APP_VERSION }}.apk"
          cp "app/build/app/outputs/bundle/release/app-release.aab" "${{ env.APP_NAME }}-${{ env.APP_VERSION }}.aab"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-APK
          path: ${{ env.APP_NAME }}-${{ env.APP_VERSION }}.apk

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-build-${{ env.BUILD_NUMBER }}
          name: ${{ env.APP_NAME }} ${{ env.APP_VERSION }}
          body: "APK = zum direkten Installieren auf dem Handy. AAB = zum Hochladen in die Google Play Console."
          files: |
            ${{ env.APP_NAME }}-${{ env.APP_VERSION }}.apk
            ${{ env.APP_NAME }}-${{ env.APP_VERSION }}.aab
