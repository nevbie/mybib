# XcodeGen spec for the iPhone app. Generate the project with `xcodegen generate` (in ios/);
# mybib.xcodeproj and Info.plist are generated and not in the repository.
name: mybib
options:
  bundleIdPrefix: app
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: de
  createIntermediateGroups: true

packages:
  MybibCore:
    path: MybibCore

settings:
  base:
    SWIFT_VERSION: "5.0"
    # CI sets both: MARKETING_VERSION=<version.txt>.<commit count>, CURRENT_PROJECT_VERSION=<commit count>
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  mybib:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Mybib
      - path: ../shared/strings.json
        buildPhase: resources
    dependencies:
      - package: MybibCore
        product: MybibCore
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: mybib
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: de
        CFBundleLocalizations: [de, en]
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiredDeviceCapabilities: [arm64]
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: mybib braucht die Kamera, um Barcodes zu scannen und Cover oder Regale zu fotografieren.
        NSPhotoLibraryUsageDescription: mybib liest Fotos aus deiner Mediathek, um Cover und Regale zu erkennen.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mybib
        PRODUCT_NAME: mybib
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "NO"
        # Signing: automatic by default (local Xcode). The release workflow overrides the MYBIB_*
        # variables on the xcodebuild command line, so only this target is signed manually.
        MYBIB_SIGN_STYLE: Automatic
        MYBIB_SIGN_IDENTITY: Apple Development
        MYBIB_TEAM: ""
        MYBIB_PROFILE: ""
        CODE_SIGN_STYLE: $(MYBIB_SIGN_STYLE)
        CODE_SIGN_IDENTITY: $(MYBIB_SIGN_IDENTITY)
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": $(MYBIB_SIGN_IDENTITY)
        DEVELOPMENT_TEAM: $(MYBIB_TEAM)
        PROVISIONING_PROFILE_SPECIFIER: $(MYBIB_PROFILE)

schemes:
  mybib:
    build:
      targets:
        mybib: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
